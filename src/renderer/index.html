<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>API Pet</title><link rel="stylesheet" href="styles.css"></head><body><main class="app">
  <section id="pet" class="pet" title="使用下方按钮打开功能"><img class="pet-image" src="assets/pet-normal.webp" alt="API Pet 默认形象"><div class="pet-actions"><button id="openChat" type="button">对话</button><button id="openSettings" type="button">设置</button></div></section>
    <section id="chatPanel" class="chat-panel hidden"><header><div><h1>和 API Pet 对话</h1><p id="chatModelLabel">通过当前路由调用模型</p></div><button id="closeChat" class="icon" type="button">×</button></header><div id="chatMessages" class="chat-messages"><div class="chat-empty">输入消息，开始对话</div></div><div id="chatAttachments" class="chat-attachments hidden" aria-label="待发送图片"></div><form id="chatForm" class="chat-form"><select id="chatMode" class="chat-mode" aria-label="对话模式"><option value="text" selected>文本</option><option value="image">绘图</option></select><div class="chat-input-wrap"><textarea id="chatInput" rows="2" placeholder="输入你的消息…" required></textarea><button id="addChatImage" class="chat-image-add" type="button" title="上传图片" aria-label="上传图片">+</button><input id="chatImageFiles" class="hidden" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple></div><button id="sendChat" class="primary" type="submit">发送</button></form></section>
    <section id="panel" class="panel hidden"><div class="panel-scroll"><header><div><h1>API Pet</h1><p>你的本地 AI 小管家</p></div><button id="closePanel" class="icon">×</button></header><div class="section-title"><span>AI Provider</span><button id="addProvider" class="primary small">＋ 添加</button></div><div id="providers" class="providers"></div><div class="balance-settings"><div class="section-title"><span>余额刷新</span><button id="refreshAllBalances" class="ghost small">立即刷新</button></div><div class="settings-grid"><label>低余额阈值<input id="lowThreshold" type="number" min="0" step="0.01"></label><label>自动刷新（分钟）<input id="refreshMinutes" type="number" min="1" step="1"></label><button id="saveBalanceSettings" class="primary small">保存</button></div></div><div class="gateway-card"><div><b>本地统一 API</b><small>http://127.0.0.1:8787/v1</small></div><button id="copyKey" class="ghost">复制 Key</button></div><div class="key-line"><code id="unifiedKey"></code></div><div class="section-title"><span>路由设置</span><small>关闭后不会执行模型路由</small></div><div class="routing-controls"><label class="switch-label"><input id="routingEnabled" type="checkbox"><span>启用路由</span></label><label class="mode-select-label">路由模式<select id="routingMode"><option value="unified">统一路由</option><option value="model">模型路由</option></select></label></div><div id="unifiedRoute" class="unified-route"></div><div id="routes" class="routes"></div><footer><button id="quit" class="danger">退出程序</button><span>配置保存在本机</span></footer></div></section>
  <dialog id="providerDialog"><form method="dialog" id="providerForm"><div class="dialog-head"><h2 id="dialogTitle">添加 Provider</h2><button value="cancel" class="icon">×</button></div><input type="hidden" id="providerId"><label>名称<input id="providerName" required placeholder="例如 API01"></label><label>登录地址<div class="login-url-row"><input id="loginUrl" required placeholder="https://example.com"><button id="connectAccountInDialog" type="button" class="ghost small">连接账户</button></div></label><label>站点类型<select id="balanceAdapter"><option value="sub2api">sub2api（账户余额和今日统计）</option><option value="new-api">New API（账户余额和今日统计）</option><option value="one-api">One API（需接口信息）</option><option value="veloera">Veloera（需接口信息）</option><option value="custom">自定义</option></select></label><label>请求地址（可选）<input id="requestUrl" placeholder="留空则使用登录地址"></label><label>API Key<div class="secret-input"><input id="providerKey" required type="password" placeholder="sk-xxxxxxxx"><button id="toggleProviderKey" type="button" class="toggle-secret" aria-label="显示 API Key" title="显示 API Key"><span class="eye-icon" aria-hidden="true"></span></button></div></label><label id="accountTokenField" class="hidden">备用登录令牌（可选）<input id="accountToken" type="password" placeholder="也可以使用 Bearer 令牌"><small>保存后可在 Provider 卡片点击“连接账户”，API Pet 会在自己的登录窗口完成授权。</small></label><label id="accountUserIdField" class="hidden">New API 用户 ID（可选）<input id="accountUserId" placeholder="自动读取网页 localStorage.uid"></label><label id="balanceUrlField">余额接口 URL<input id="balanceUrl" placeholder="自定义 Adapter 使用"></label><label id="balanceMethodField">请求方法<input id="balanceMethod" value="GET" placeholder="GET"></label><label id="balancePathField">余额字段路径<input id="balancePath" value="data.balance" placeholder="data.balance"></label><label id="remainingPathField">剩余额度字段路径（可选）<input id="remainingPath" placeholder="data.remaining"></label><label>货币单位<select id="currency"><option value="$">$</option><option value="￥">￥</option></select></label><div class="dialog-actions"><button value="cancel" class="ghost">取消</button><button id="saveProvider" value="default" class="primary">保存并测试</button></div></form></dialog>
  <div id="toast" class="toast"></div>
</main><script src="app.js"></script></body></html>
